# Cập nhật kho luật từ Công báo điện tử, mỗi ngày một lần.
#
# MỘT job, CRAWL ĐÚNG MỘT LẦN. Đây không phải lựa chọn thẩm mỹ: crawler ghi
# status:"ok" vào state ngay sau khi tải xong (congbao.py:320-322) và bỏ qua mọi
# văn bản đã "ok" (congbao.py:311). Nên thiết kế "job nhẹ dò trước, job nặng nạp
# sau" sẽ KHÔNG BAO GIỜ nạp được gì - job hai luôn thấy 0 văn bản mới và báo
# xanh vĩnh viễn. Vì vậy: crawl một lần, ghi ra --save-dir, rồi --ingest-dir đọc
# lại từ đó.
#
# Cập nhật xong KHÔNG cần deploy: kho nằm trên GCS, Cloud Run chạy scale-to-zero
# nên lần khởi động nguội kế tiếp tự lấy bản mới.

name: Cập nhật kho luật

on:
  schedule:
    # 22:00 UTC = 05:00 giờ Việt Nam. Công báo đăng trong giờ hành chính nên
    # chạy sáng sớm là bắt được trọn ngày hôm trước.
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      max_docs:
        description: "Số văn bản tối đa lấy trong một lượt"
        default: "20"
      types:
        description: "Lọc loại, ví dụ: decree,circular (bỏ trống = lấy tất cả)"
        default: ""

permissions:
  contents: read
  id-token: write # cần cho Workload Identity Federation

concurrency:
  # Lượt sau huỷ lượt trước: hai lượt cùng crawl một nguồn vừa vô ích vừa bất lịch sự.
  group: cap-nhat-kho-luat
  cancel-in-progress: true

env:
  BUCKET: luatai-corpus-luatai
  WIF_PROVIDER: projects/109110304318/locations/global/workloadIdentityPools/github/providers/github-provider
  WIF_SA: github-ci@luatai.iam.gserviceaccount.com

jobs:
  cap-nhat:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Bước dò chỉ cần hai gói. Embedder/VectorStore được import muộn trong
      # refresh_corpus.py nên đường này không chạm torch - những ngày không có
      # gì mới, cả lượt chạy tính bằng giây.
      - name: Cài phụ thuộc cho việc dò
        run: pip install "requests>=2.31" "pymupdf>=1.24"

      - name: Khôi phục state và cache bytes thô
        uses: actions/cache@v4
        with:
          path: |
            data/congbao_state.json
            data/cache/congbao
          # Key đổi mỗi lượt để cache luôn được ghi mới; restore-keys kéo về bản
          # gần nhất. Không có phần này thì mỗi sáng lại báo trùng 50 văn bản cũ
          # và tải lại PDF của họ một cách vô ích.
          key: congbao-${{ github.run_id }}
          restore-keys: congbao-

      - name: Dò văn bản mới
        id: do
        run: |
          set -o pipefail
          python scripts/refresh_corpus.py \
            --recent \
            --max-docs "${{ github.event.inputs.max_docs || '20' }}" \
            --types "${{ github.event.inputs.types || '' }}" \
            --save-dir van-ban-moi \
            --dry-run 2>&1 | tee ket-qua.txt
          echo "so_luong=$(ls van-ban-moi 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"

      # ----- từ đây chỉ chạy khi THẬT SỰ có văn bản mới -----

      - name: Đăng nhập Google Cloud
        if: steps.do.outputs.so_luong != '0'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.do.outputs.so_luong != '0'

      - name: Cài phụ thuộc đầy đủ để nhúng
        if: steps.do.outputs.so_luong != '0'
        run: pip install -r requirements-deploy.txt

      - name: Tải kho hiện tại
        if: steps.do.outputs.so_luong != '0'
        run: |
          # Object để public nên tải bằng curl, không cần xác thực.
          curl -sfL "https://storage.googleapis.com/${BUCKET}/corpus/current.tar.gz" \
            -o corpus.tar.gz
          mkdir -p data && tar xzf corpus.tar.gz -C data && rm corpus.tar.gz
          echo "kho hiện tại: $(python -c "
          import json; print(json.load(open('data/corpus_meta.json'))['chunks'], 'chunk')")"

      - name: Nạp văn bản mới vào kho
        if: steps.do.outputs.so_luong != '0'
        # --ingest-dir đọc JSON đã crawl ở bước trên, KHÔNG crawl lại.
        # check_corpus_intact trong script sẽ dừng nếu kho teo bất thường.
        run: python scripts/refresh_corpus.py --ingest-dir van-ban-moi

      - name: Đóng gói và đẩy kho mới lên GCS
        if: steps.do.outputs.so_luong != '0'
        run: |
          set -eu
          tar czf corpus.tar.gz -C data chroma_db corpus_meta.json
          DATE=$(date -u +%F)
          gcloud storage cp corpus.tar.gz "gs://${BUCKET}/corpus/${DATE}.tar.gz"
          gcloud storage cp "gs://${BUCKET}/corpus/${DATE}.tar.gz" \
                            "gs://${BUCKET}/corpus/current.tar.gz"
          echo "đã đẩy kho $(du -h corpus.tar.gz | cut -f1) lên GCS"
          # Giữ 2 bản theo ngày mới nhất để lùi về khi bản mới hỏng, xoá phần
          # còn lại (mỗi bản ~380 MB, để dồn thì vượt 5 GB free tier). Đếm theo
          # SỐ BẢN chứ không theo tuổi: đợt nghỉ dài không có văn bản mới thì
          # quy tắc theo tuổi xoá sạch bản dự phòng. Tên YYYY-MM-DD nên sort chữ
          # là sort ngày. Bucket đã tắt soft delete (26/09), không thì file xoá
          # vẫn bị tính tiền thêm 7 ngày.
          gcloud storage ls "gs://${BUCKET}/corpus/2*.tar.gz" | sort | head -n -2 \
            | xargs -r gcloud storage rm
          # Không cần deploy lại: Cloud Run chạy scale-to-zero, lần khởi động
          # nguội kế tiếp sẽ tải bản current.tar.gz mới này.

      - name: Ghi tóm tắt
        if: always()
        run: |
          {
            echo "## Công báo - $(date -u '+%d/%m/%Y')"
            echo
            echo '```'
            cat ket-qua.txt 2>/dev/null || echo "Lượt chạy hỏng trước khi kịp in gì."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Giữ lại văn bản mới
        if: steps.do.outputs.so_luong != '0'
        uses: actions/upload-artifact@v4
        with:
          name: van-ban-moi-${{ github.run_number }}
          path: van-ban-moi/
          retention-days: 90

# Lưu ý vận hành:
# - Repo này là PRIVATE nên Actions có tính phút (gói GitHub Pro cho 3.000
#   phút/tháng). Ngày không có gì mới tốn khoảng một phút; ngày có văn bản mới
#   tốn ~10-15 phút vì phải cài torch và nhúng. Vẫn dư xa.
# - GitHub TỰ TẮT scheduled workflow khi repo không hoạt động 60 ngày, và không
#   báo gì cả. Cứ ~50 ngày nên đẩy một commit hoặc chạy tay workflow_dispatch.
